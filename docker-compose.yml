services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: projectiq
      POSTGRES_USER: projectiq_user
      POSTGRES_PASSWORD: CHANGE_THIS_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
